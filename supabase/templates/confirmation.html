<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:32px 16px;background:#eaf4ff;color:#0b2d6b;font-family:Arial,sans-serif">
    <main style="max-width:480px;margin:auto;padding:32px;background:#fff;border-radius:24px">
      <p style="margin:0 0 28px;font-size:24px;font-weight:bold;line-height:40px;color:#0b2d6b"><img src="https://nuvemmeet.vercel.app/brand/logo-icon.png" alt="" width="40" height="40" style="display:inline-block;vertical-align:middle;width:40px;height:40px;border:0;margin-right:10px">Nuv<span style="color:#2f80ff">Link</span></p>
      <h1 style="font-size:24px">Confirme seu e-mail</h1>
      <p style="line-height:1.6">Falta um passo para acessar sua agenda. Confirme seu endereço usando o botão abaixo.</p>
      <p style="margin:28px 0"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=signup&amp;redirect_to={{ .RedirectTo | urlquery }}" style="display:inline-block;padding:14px 22px;border-radius:999px;background:#0b2d6b;color:#fff;text-decoration:none;font-weight:bold">Confirmar minha conta</a></p>
      <p style="font-size:14px;line-height:1.6">O link é pessoal e pode ser usado uma vez. Se você não solicitou esta conta, ignore este e-mail.</p>
    </main>
  </body>
</html>
