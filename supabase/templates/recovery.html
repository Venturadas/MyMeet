<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:32px 16px;background:#eef5ff;color:#17335c;font-family:Arial,sans-serif">
    <main style="max-width:480px;margin:auto;padding:32px;background:#fff;border-radius:24px">
      <p style="font-size:22px;font-weight:bold;color:#2563eb">MyMeet</p>
      <h1 style="font-size:24px">Recupere seu acesso</h1>
      <p style="line-height:1.6">Recebemos um pedido para trocar sua senha. Use o botão abaixo para definir uma nova senha.</p>
      <p style="margin:28px 0"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery" style="display:inline-block;padding:14px 22px;border-radius:999px;background:#2563eb;color:#fff;text-decoration:none;font-weight:bold">Criar nova senha</a></p>
      <p style="font-size:14px;line-height:1.6">O link é pessoal e pode ser usado uma vez. Se você não pediu esta alteração, ignore este e-mail.</p>
    </main>
  </body>
</html>
